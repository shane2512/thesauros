# Render's free web service sleeps after ~15 minutes without inbound traffic, and the autonomous
# worker runs inside that same service, so a sleeping service means a stopped treasury loop.
# This pings the public health endpoint from outside Render on a schedule to keep it awake.
# GitHub's scheduler can run a few minutes late and pauses scheduled workflows on repos with no
# activity for 60 days, so re-enable it from the Actions tab if that happens.
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            --output /dev/null --write-out 'status=%{http_code} time=%{time_total}s\n' \
            https://thesauros-wb3.onrender.com/api/config
